
services:

  design-system:
    build: design-system
    ports:
      - "41032:41032"
    develop:
      watch:
        - action: rebuild
          path: ./design-system/src
        - action: rebuild
          path: ./design-system/package.json

  portfolio:
    build:
      context: portfolio
      additional_contexts:
        design-system: service:design-system
    ports:
      - "23052:23052"
    develop:
      watch:
        - action: rebuild
          path: ./portfolio
        - action: rebuild
          path: ./design-system